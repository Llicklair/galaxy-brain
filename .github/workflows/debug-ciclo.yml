# TEMPORAL: reproduce el racimo del ciclo en el runner con `pytest -l`
# (la regla de la casa) y delata versiones. Se borra al cerrar el diagnostico.
name: debug-ciclo
on: workflow_dispatch
jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: versiones del runner
        run: |
          git --version
          command -v ast-grep && ast-grep --version || echo "sin ast-grep en PATH"
          command -v sg && sg --version || echo "sin sg en PATH"
          git config --system --list || true
          git config --global --list || true
      - name: instalar
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - run: gb on
      - name: el ciclo con locales
        run: python -m pytest tests/test_ciclo.py -x -q -l
