# TEMPORAL: biseccion del veneno de coleccion — el racimo 3.9 solo aparece
# con la suite completa, y el subconjunto a-c (que precede al racimo en
# ejecucion) salio limpio: lo que queda es el IMPORT de los modulos d-z
# durante la coleccion. Tres grupos, cada uno importado junto a la victima.
# Se borra al cerrar el diagnostico.
name: debug-ciclo
on: workflow_dispatch
jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: instalar
        run: |
          python -m pip install -e .
          python -m pip install pytest
          npm install -g "@ast-grep/cli@0.45"
      - run: gb on
      - name: grupo d-g + victima
        continue-on-error: true
        run: python -m pytest tests/test_[d-g]*.py tests/test_calls.py -q 2>&1 | tail -4
      - name: grupo h-m + victima
        continue-on-error: true
        run: python -m pytest tests/test_[h-m]*.py tests/test_calls.py -q 2>&1 | tail -4
      - name: grupo n-z + victima
        continue-on-error: true
        run: python -m pytest tests/test_[n-z]*.py tests/test_calls.py -q 2>&1 | tail -4
