# TEMPORAL: reproduce el racimo de intervencion SOLO-3.9-suite-completa con
# el setup exacto del ci y para en el primer fallo con locales (pytest -x -l).
# Se borra al cerrar el diagnostico.
name: debug-ciclo
on: workflow_dispatch
jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: instalar
        run: |
          python -m pip install -e .
          python -m pip install pytest
          npm install -g "@ast-grep/cli@0.45"
      - run: gb on
      - name: hasta el primer fallo, con locales
        run: python -m pytest tests/test_a*.py tests/test_b*.py tests/test_c*.py -q -x -l --tb=long 2>&1 | tail -120
