# TEMPORAL: biseccion del veneno de coleccion — el racimo 3.9 solo aparece
# con la suite completa, y el subconjunto a-c (que precede al racimo en
# ejecucion) salio limpio: lo que queda es el IMPORT de los modulos d-z
# durante la coleccion. Tres grupos, cada uno importado junto a la victima.
# Se borra al cerrar el diagnostico.
name: debug-ciclo
on: workflow_dispatch
jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: instalar
        run: |
          python -m pip install -e .
          python -m pip install pytest
          npm install -g "@ast-grep/cli@0.45"
      - run: gb on
      - name: biseccion fina n-z y pareja minima con locales
        run: |
          malo=""
          for f in tests/test_[n-z]*.py; do
            r=$(python -m pytest "$f" tests/test_calls.py -q 2>&1 | tail -1)
            echo "$f -> $r"
            case "$r" in *failed*) malo=$f;; esac
          done
          if [ -n "$malo" ]; then
            echo "=== PAREJA MINIMA: $malo + test_calls, con locales ==="
            python -m pytest "$malo" tests/test_calls.py -q -x -l --tb=long 2>&1 | tail -80
          else
            echo "ningun fichero n-z envenena en pareja: el veneno exige mas de un modulo"
          fi
