# TEMPORAL: la pareja minima (test_symbols + victima) con una sonda que
# imprime CADA intermedio de _fichero_movido_despues — el git log crudo y
# cada parse_ts — dentro del contexto envenenado. Se borra al cerrar.
name: debug-ciclo
on: workflow_dispatch
jobs:
  ciclo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: instalar
        run: |
          python -m pip install -e .
          python -m pip install pytest
      - run: gb on
      - name: la sonda de intermedios
        run: |
          cat > tests/test_zz_sonda.py <<'EOF'
          def test_sonda_movido(tmp_path, capsys):
              import subprocess
              root = str(tmp_path)
              (tmp_path / "lib.py").write_text("def ayuda():\n    pass\n")
              for o in (("init", "-q"), ("config", "user.email", "t@t"),
                        ("config", "user.name", "t"), ("add", "-A"),
                        ("commit", "-q", "-m", "v1")):
                  subprocess.run(("git",) + o, cwd=root, check=True,
                                 capture_output=True)
              from galaxybrain import cli, store
              from galaxybrain import graph as g
              with capsys.disabled():
                  raw = g._git(root, "log", "-1", "--format=%cI %h", "--", "lib.py")
                  print("RAW LOG:", repr(raw))
                  print("RAW STATUS:", repr(g._git(root, "status", "--porcelain", "--", "lib.py")))
                  print("PARSE 2020:", repr(store.parse_ts("2020-01-01T00:00:00+00:00")))
                  fecha = (raw or "").strip().partition(" ")[0]
                  print("FECHA:", repr(fecha), "-> PARSE:", repr(store.parse_ts(fecha)))
                  print("MOVIDO:", repr(cli._fichero_movido_despues(root, "lib.py", "2020-01-01T00:00:00+00:00")))
          EOF
          echo "=== SOLO la sonda ==="
          python -m pytest tests/test_zz_sonda.py -q 2>&1 | tail -8
          echo "=== test_symbols + sonda (contexto envenenado) ==="
          python -m pytest tests/test_symbols.py tests/test_zz_sonda.py -q 2>&1 | tail -10
