name: tests

# Gate auto-verificable: la toolchain corre en cada push/PR, no solo en un portatil.
on:
  push:
  pull_request:

jobs:
  test:
    # La propia tesis de galaxy-brain es "gates deterministas siempre puestas" —
    # aplicarla a si misma es lo minimo. Instala (valida el build de hatchling),
    # corre los tests en el suelo (3.9) y en versiones recientes, y pasa su propio
    # gate de acoplamiento.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, con dev) — ejercita el empaquetado también
        run: pip install -e ".[dev]"
      - name: ast-grep por referencia (ADR 0009), como en ci.yml
        # Sin el, el gate no puede examinar lo que no es Python (hooks_lang) y
        # se niega a certificar: este workflow llevaba en rojo por eso.
        run: npm install -g "@ast-grep/cli@0.45"
      - name: Run the test suite
        run: python -m pytest tests/ -q
      - name: Coupling gate (dogfood) — el mismo que corre el pre-commit
        run: python -m galaxybrain.cli graph src --gate --color never
